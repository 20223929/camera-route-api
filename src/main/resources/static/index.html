<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101827">
    <title>沿途摄像头检索</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0b1220;
            --panel: #111c2e;
            --panel-soft: #17243a;
            --line: #26364e;
            --text: #e8eef8;
            --muted: #91a2ba;
            --blue: #4e9cff;
            --cyan: #42d3cf;
            --red: #ff657a;
            --green: #3bd6a3;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: radial-gradient(circle at 15% 0%, #14253e 0, var(--bg) 42%);
            color: var(--text);
            font: 14px/1.5 Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
        }
        button, input, select, textarea { font: inherit; }
        .topbar {
            height: 66px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 28px; border-bottom: 1px solid rgba(145,162,186,.16);
            background: rgba(11,18,32,.8); backdrop-filter: blur(16px);
        }
        .brand { display:flex; align-items:center; gap:12px; font-size:16px; font-weight:700; letter-spacing:.3px; }
        .brand-mark {
            width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
            color:#071522;background:linear-gradient(135deg,#54d7d0,#4e9cff);
            box-shadow:0 5px 22px rgba(78,156,255,.22);font-size:18px;
        }
        .top-note { color:var(--muted); font-size:12px; }
        .layout { display:grid; grid-template-columns:350px minmax(0,1fr); gap:18px; padding:18px; max-width:1800px; margin:auto; min-height:calc(100vh - 66px); }
        .panel { background:linear-gradient(180deg,rgba(20,32,51,.97),rgba(15,25,41,.97)); border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 40px rgba(0,0,0,.16); }
        .sidebar { padding:20px; align-self:start; }
        h1 { font-size:19px; margin:0 0 5px; }
        .sub { color:var(--muted); font-size:12px; margin-bottom:22px; }
        .field { margin:16px 0; }
        .field-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
        label { display:block; color:#cbd6e6; font-size:12px; font-weight:600; }
        .hint { color:#71839d; font-size:11px; font-weight:400; }
        textarea, input, select {
            width:100%; color:var(--text); background:#0b1525; border:1px solid #2a3b55;
            border-radius:9px; outline:none; padding:10px 11px; transition:border .2s,box-shadow .2s;
        }
        textarea:focus, input:focus, select:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(78,156,255,.12); }
        textarea { min-height:152px; resize:vertical; line-height:1.8; font-family:Consolas,monospace; font-size:12px; }
        .row-fields { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        .actions { display:flex; gap:9px; margin-top:19px; }
        button { border:0; border-radius:9px; cursor:pointer; transition:filter .15s,transform .15s; }
        button:hover { filter:brightness(1.1); }
        button:active { transform:translateY(1px); }
        .primary { flex:1; padding:11px 14px; color:#071522; font-weight:700; background:linear-gradient(100deg,#54d7d0,#62aaff); }
        .secondary { padding:10px 13px; color:#c8d6e9; background:#24344d; border:1px solid #354966; }
        .status { margin-top:14px; padding:10px 11px; border-radius:9px; color:var(--muted); background:#0b1525; border:1px solid #24354d; font-size:12px; min-height:39px; }
        .status.error { color:#ff9aaa; border-color:rgba(255,101,122,.35); }
        .status.ok { color:#70e2bb; border-color:rgba(59,214,163,.28); }
        .main { min-width:0; min-height:calc(100vh - 102px); }
        .map-panel { overflow:hidden; position:relative; }
        #map { height:calc(100vh - 102px); min-height:560px; background:#15243a; }
        .map-tools { position:absolute; z-index:500; top:14px; left:14px; display:flex; gap:8px; pointer-events:none; }
        .map-chip { pointer-events:auto; padding:7px 10px; border:1px solid rgba(255,255,255,.12); border-radius:8px; background:rgba(12,22,37,.9); color:#dce8f8; font-size:11px; box-shadow:0 4px 14px #0003; }
        .legend { position:absolute; z-index:500; right:14px; bottom:14px; padding:10px 12px; background:rgba(12,22,37,.92); border:1px solid #ffffff20; border-radius:10px; color:#dce8f8; font-size:11px; display:grid; gap:7px; }
        .legend span { display:flex; align-items:center; gap:7px; }
        .dot { width:9px;height:9px;border-radius:50%;display:inline-block; }
        .dot.route { background:#42d3cf; box-shadow:0 0 0 3px #42d3cf33; }
        .dot.camera { background:#ff657a; box-shadow:0 0 0 3px #ff657a33; }
        .amap-info-content { background:#132238;color:#e8eef8;border:1px solid #2a3b55;border-radius:8px;font-size:12px;line-height:1.7; }
        .amap-info-sharp { border-top-color:#132238; }
        @media (max-width:1050px) {
            .layout { grid-template-columns:300px minmax(0,1fr); padding:12px; gap:12px; }
            .main { min-height:480px; }
        }
        @media (max-width:760px) {
            .topbar { padding:0 16px; }
            .top-note { display:none; }
            .layout { display:flex; flex-direction:column; }
            .sidebar { width:100%; }
            .main { min-height:420px; }
            #map { height:60vh; min-height:420px; }
        }
    </style>
</head>
<body>
<header class="topbar">
    <div class="brand"><div class="brand-mark">⌖</div><span>沿途摄像头检索</span></div>
    <div class="top-note">ROUTE CAMERA SEARCH · 同步查询</div>
</header>

<div class="layout">
    <aside class="panel sidebar">
        <h1>路线查询</h1>
        <div class="sub">输入路线坐标，检索路线周边摄像头设备</div>

        <div class="field">
            <div class="field-head">
                <label for="coordinates">路线坐标</label>
                <span class="hint">每行一个点：经度,纬度（GeoJSON 顺序）</span>
            </div>
            <textarea id="coordinates" spellcheck="false">121.473700,31.230400
121.480000,31.232000
121.486000,31.235000
121.492000,31.238000</textarea>
            <div class="hint" style="margin-top:6px">支持多个途经点；也可以直接在地图上点击添加路线点。请求时自动封装为 GeoJSON LineString。</div>
        </div>

        <div class="row-fields">
            <div class="field">
                <label for="coordType">坐标系</label>
                <select id="coordType">
                    <option value="WGS84">WGS84</option>
                    <option value="GCJ-02">GCJ-02</option>
                </select>
            </div>
            <div class="field">
                <label for="buffer">搜索半径（米）</label>
                <input id="buffer" type="number" min="0" max="10000" value="100">
            </div>
        </div>
        <div class="field">
            <label for="apiPath">接口地址</label>
            <input id="apiPath" type="text" value="/api/camera/route/list">
        </div>
        <div class="actions">
            <button class="primary" id="searchBtn" type="button">⌕　查询沿途摄像头</button>
            <button class="secondary" id="resetBtn" type="button">重置</button>
        </div>
        <div class="status" id="status">已载入上海市默认路线。可修改路线坐标，或点击地图添加路线点。</div>
        <div class="hint" style="margin-top:12px">提示：默认定位上海市中心；查询结果以摄像头地图标记展示，点击标记可查看设备信息。</div>
    </aside>

    <main class="main">
        <section class="panel map-panel">
            <div id="map"></div>
            <div class="map-tools">
                <div class="map-chip">路线与摄像头分布 · 路线点 <strong id="routeCount">4</strong></div>
                <button class="map-chip" id="clearPoints" type="button">清空路线点</button>
            </div>
            <div class="legend">
                <span><i class="dot route"></i> 查询路线</span>
                <span><i class="dot camera"></i> 摄像头设备</span>
            </div>
        </section>

    </main>
</div>

<script src="https://webapi.amap.com/loader.js"></script>
<script src="/amap-config.js"></script>
<script>
    (function () {
        "use strict";

        const DEFAULT_COORDINATES = [
            [121.473700, 31.230400],
            [121.480000, 31.232000],
            [121.486000, 31.235000],
            [121.492000, 31.238000]
        ];
        let AMap = null;
        let map = null;
        let routeOverlays = [];
        let cameraOverlays = [];
        let routePoints = DEFAULT_COORDINATES.map(point => point.slice());
        let routePointsType = "WGS84";
        let lastCameraResults = [];
        let lastCameraResultsType = null;
        const pageSize = 1000;
        let total = 0;
        let cameraMarkers = new Map();
        let isSearching = false;

        const $ = id => document.getElementById(id);
        const status = $("status");

        function setStatus(message, type) {
            status.textContent = message;
            status.className = "status" + (type ? " " + type : "");
        }

        function parseCoordinates() {
            const lines = $("coordinates").value.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
            if (lines.length < 2) throw new Error("路线至少需要两个坐标点");
            return lines.map((line, index) => {
                const values = line.split(/[,，\s]+/).filter(Boolean);
                if (values.length !== 2) throw new Error("第 " + (index + 1) + " 行格式错误，应为：经度,纬度");
                const longitude = Number(values[0]);
                const latitude = Number(values[1]);
                if (!Number.isFinite(longitude) || !Number.isFinite(latitude)
                    || longitude < -180 || longitude > 180 || latitude < -90 || latitude > 90) {
                    throw new Error("第 " + (index + 1) + " 行经纬度无效");
                }
                return [longitude, latitude];
            });
        }

        function clearOverlays(overlays) {
            if (map && overlays.length) map.remove(overlays);
            overlays.length = 0;
        }

        function wgs84ToGcj02(longitude, latitude) {
            const a = 6378245.0;
            const ee = 0.00669342162296594323;
            const pi = Math.PI;
            if (longitude < 72.004 || longitude > 137.8347 || latitude < 0.8293 || latitude > 55.8271) {
                return [longitude, latitude];
            }
            let dLat = transformLat(longitude - 105.0, latitude - 35.0);
            let dLon = transformLon(longitude - 105.0, latitude - 35.0);
            const radLat = latitude / 180.0 * pi;
            let magic = Math.sin(radLat);
            magic = 1 - ee * magic * magic;
            const sqrtMagic = Math.sqrt(magic);
            dLat = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * pi);
            dLon = (dLon * 180.0) / (a / sqrtMagic * Math.cos(radLat) * pi);
            return [longitude + dLon, latitude + dLat];
        }

        function transformLat(x, y) {
            let value = -100 + 2*x + 3*y + 0.2*y*y + 0.1*x*y + 0.2*Math.sqrt(Math.abs(x));
            value += (20*Math.sin(6*x*Math.PI) + 20*Math.sin(2*x*Math.PI))*2/3;
            value += (20*Math.sin(y*Math.PI) + 40*Math.sin(y/3*Math.PI))*2/3;
            value += (160*Math.sin(y/12*Math.PI) + 320*Math.sin(y*Math.PI/30))*2/3;
            return value;
        }

        function transformLon(x, y) {
            let value = 300 + x + 2*y + 0.1*x*x + 0.1*x*y + 0.1*Math.sqrt(Math.abs(x));
            value += (20*Math.sin(6*x*Math.PI) + 20*Math.sin(2*x*Math.PI))*2/3;
            value += (20*Math.sin(x*Math.PI) + 40*Math.sin(x/3*Math.PI))*2/3;
            value += (150*Math.sin(x/12*Math.PI) + 300*Math.sin(x/30*Math.PI))*2/3;
            return value;
        }

        function gcj02ToWgs84(longitude, latitude) {
            let guessLon = longitude;
            let guessLat = latitude;
            for (let i = 0; i < 8; i++) {
                const converted = wgs84ToGcj02(guessLon, guessLat);
                const deltaLon = converted[0] - longitude;
                const deltaLat = converted[1] - latitude;
                guessLon -= deltaLon;
                guessLat -= deltaLat;
                if (Math.max(Math.abs(deltaLon), Math.abs(deltaLat)) < 1e-7) break;
            }
            return [guessLon, guessLat];
        }

        function toMapPosition(point, sourceType) {
            return sourceType === "GCJ-02" ? point.slice() : wgs84ToGcj02(point[0], point[1]);
        }

        function convertCoordinate(point, fromType, toType) {
            if (fromType === toType) return point.slice();
            return fromType === "WGS84"
                ? wgs84ToGcj02(point[0], point[1])
                : gcj02ToWgs84(point[0], point[1]);
        }

        function syncCoordinateText() {
            $("coordinates").value = routePoints
                .map(point => point.map(value => Number(value).toFixed(8)).join(","))
                .join("\n");
        }

        function updateRoute() {
            if (!map || !AMap) return;
            clearOverlays(routeOverlays);
            const sourceType = routePointsType;
            const path = routePoints.map(point => toMapPosition(point, sourceType));
            if (path.length) {
                const line = new AMap.Polyline({
                    path: path, strokeColor: "#42d3cf", strokeWeight: 5,
                    strokeOpacity: .95, lineJoin: "round", lineCap: "round"
                });
                routeOverlays.push(line);
                const start = new AMap.CircleMarker({
                    center: path[0], radius: 7, strokeColor: "#0b1728",
                    strokeWeight: 2, fillColor: "#42d3cf", fillOpacity: 1
                });
                routeOverlays.push(start);
                if (path.length > 1) {
                    const end = new AMap.CircleMarker({
                        center: path[path.length - 1], radius: 7, strokeColor: "#0b1728",
                        strokeWeight: 2, fillColor: "#4e9cff", fillOpacity: 1
                    });
                    routeOverlays.push(end);
                }
                map.add(routeOverlays);
                if (path.length > 1) map.setFitView(routeOverlays, false, [60, 60, 60, 60]);
                else map.setZoomAndCenter(14, path[0]);
            }
            $("routeCount").textContent = String(routePoints.length);
        }

        function escapeHtml(value) {
            return String(value == null ? "" : value).replace(/[&<>"']/g, char => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
            })[char]);
        }

        function formatNumber(value, digits) {
            const number = Number(value);
            return Number.isFinite(number) ? number.toFixed(digits) : "—";
        }

        function renderCameras(cameras, sourceType) {
            lastCameraResults = cameras.slice();
            lastCameraResultsType = cameras.length ? sourceType : null;
            clearOverlays(cameraOverlays);
            cameraMarkers.clear();
            if (!map || !AMap || !cameras.length) return;

            try {
                cameras.forEach(camera => {
                    const longitude = Number(camera.x);
                    const latitude = Number(camera.y);
                    if (!Number.isFinite(longitude) || !Number.isFinite(latitude)) return;
                    const position = toMapPosition([longitude, latitude], sourceType);
                    const marker = new AMap.Marker({
                        position: position,
                        title: camera.sbmc || "未命名设备",
                        offset: new AMap.Pixel(-7, -7),
                        content: '<div style="width:12px;height:12px;border:2px solid #fff;border-radius:50%;background:#ff657a;box-shadow:0 0 0 3px #ff657a44"></div>'
                    });
                    marker.on("click", () => {
                        const info = new AMap.InfoWindow({
                            content: "<strong>" + escapeHtml(camera.sbmc || "未命名设备") + "</strong><br>" +
                                "设备编码：" + escapeHtml(camera.sbbm) + "<br>" +
                                "键盘编号：" + escapeHtml(camera.jpbh || "—") + "<br>" +
                                "坐标（" + escapeHtml(sourceType) + "）：" +
                                longitude.toFixed(6) + ", " + latitude.toFixed(6) + "<br>" +
                                "厂商：" + escapeHtml(camera.sbcs || "—") + "<br>" +
                                "行政区：" + escapeHtml(camera.xzqmc || "—") + "<br>" +
                                "所属派出所：" + escapeHtml(camera.pcsmc || "—"),
                            offset: new AMap.Pixel(0, -12)
                        });
                        info.open(map, position);
                    });
                    cameraOverlays.push(marker);
                    cameraMarkers.set(String(camera.sbbm), { marker: marker, position: position });
                });
                if (cameraOverlays.length) map.add(cameraOverlays);
            } catch (mapError) {
                console.error("摄像头地图标记绘制失败：", mapError);
                setStatus("查询数据已返回，但摄像头地图标记绘制失败，请检查浏览器控制台。", "error");
            }
        }

        async function search() {
            if (isSearching) return;
            let coordinates;
            let requestType;
            let timeoutId;
            isSearching = true;
            $("searchBtn").disabled = true;
            $("resetBtn").disabled = true;
            $("clearPoints").disabled = true;
            $("coordType").disabled = true;
            $("searchBtn").textContent = "正在查询…";
            renderCameras([], null);
            let resultsRendered = false;
            try {
                requestType = $("coordType").value;
                coordinates = parseCoordinates();
                const bufferDistance = Number($("buffer").value);
                if (!Number.isInteger(bufferDistance) || bufferDistance < 0 || bufferDistance > 10000) {
                    throw new Error("搜索半径必须是 0 至 10000 之间的整数");
                }
                const endpoint = $("apiPath").value.trim();
                if (!endpoint) throw new Error("请填写接口地址");
                routePoints = coordinates.map(point => point.slice());
                routePointsType = requestType;
                updateRoute();
                setStatus("正在同步查询路线周边摄像头，请稍候…");
                const query = new URLSearchParams({ pageNum: "1", pageSize: String(pageSize) });
                const controller = new AbortController();
                timeoutId = window.setTimeout(() => controller.abort(), 65000);
                const response = await fetch(endpoint + "?" + query.toString(), {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    signal: controller.signal,
                    body: JSON.stringify({
                        type: requestType,
                        bufferDistance: bufferDistance,
                        geometry: {
                            type: "LineString",
                            coordinates: coordinates
                        }
                    })
                });
                const responseText = await response.text();
                let result;
                try {
                    result = responseText ? JSON.parse(responseText) : {};
                } catch (parseError) {
                    throw new Error("服务器返回了无法识别的响应（HTTP " + response.status + "）");
                }
                if (!response.ok) {
                    throw new Error(result.msg || result.message || result.error || ("HTTP " + response.status));
                }
                if (!result || result.code !== 200) {
                    throw new Error(result && result.msg ? result.msg : "接口返回失败");
                }
                const pageResult = result.data || {};
                if (!Array.isArray(pageResult.data)) {
                    throw new Error("接口分页数据格式不正确");
                }
                const cameras = pageResult.data;
                total = Number(pageResult.total) || 0;
                renderCameras(cameras, requestType);
                resultsRendered = true;
                setStatus("查询完成：路线周边共 " + total.toLocaleString("zh-CN") + " 个摄像头，地图显示前 " + cameras.length + " 个结果。", "ok");
            } catch (error) {
                if (!resultsRendered) renderCameras([]);
                total = resultsRendered ? total : 0;
                setStatus(
                    error.name === "AbortError"
                        ? "查询超时（65 秒），请检查服务状态或缩短路线。"
                        : (error.message || "查询失败，请检查接口服务和网络。"),
                    "error"
                );
            } finally {
                if (timeoutId) window.clearTimeout(timeoutId);
                isSearching = false;
                $("searchBtn").disabled = false;
                $("searchBtn").textContent = "⌕　查询沿途摄像头";
                $("resetBtn").disabled = false;
                $("clearPoints").disabled = false;
                $("coordType").disabled = false;
            }
        }

        $("searchBtn").addEventListener("click", () => search());
        $("resetBtn").addEventListener("click", () => {
            routePoints = DEFAULT_COORDINATES.map(point => point.slice());
            routePointsType = "WGS84";
            $("coordType").value = "WGS84";
            syncCoordinateText();
            $("buffer").value = "100";
            renderCameras([], null);
            total = 0;
            updateRoute();
            setStatus("已恢复上海市默认路线。");
        });
        $("clearPoints").addEventListener("click", () => {
            routePoints = [];
            syncCoordinateText();
            updateRoute();
            setStatus("路线点已清空。点击地图添加起点和途经点。");
        });

        function initializeAmap() {
            const config = window.AMAP_CONFIG || {};
            if (!config.key || config.key.indexOf("请填写") === 0 || !config.securityJsCode || config.securityJsCode.indexOf("请填写") === 0) {
                setStatus("请先在 src/main/resources/static/amap-config.js 中配置高德 Web 端 Key 和安全密钥。", "error");
                return;
            }
            window._AMapSecurityConfig = { securityJsCode: config.securityJsCode };
            AMapLoader.load({
                key: config.key,
                version: "2.0",
                plugins: ["AMap.Scale", "AMap.ToolBar"]
            }).then(loadedAMap => {
                AMap = loadedAMap;
                map = new AMap.Map("map", {
                    viewMode: "2D",
                    zoom: 12,
                    center: [121.4737, 31.2304],
                    resizeEnable: true
                });
                map.addControl(new AMap.Scale());
                map.addControl(new AMap.ToolBar({ position: "RB" }));
                map.on("click", event => {
                    if (isSearching) return;
                    const mapPoint = [Number(event.lnglat.getLng().toFixed(6)), Number(event.lnglat.getLat().toFixed(6))];
                    const point = routePointsType === "GCJ-02"
                        ? mapPoint : gcj02ToWgs84(mapPoint[0], mapPoint[1]);
                    routePoints.push(point);
                    syncCoordinateText();
                    updateRoute();
                    setStatus("已添加路线点 " + routePoints.length + "，点击“查询沿途摄像头”执行检索。");
                });
                updateRoute();
                setStatus("高德地图加载成功。可输入路线坐标或点击地图添加路线点。", "ok");
            }).catch(error => {
                console.error("高德地图加载失败：", error);
                setStatus("高德地图加载失败，请检查 Key、安全密钥、域名白名单及网络。", "error");
            });
        }

        $("coordType").addEventListener("change", () => {
            const previousType = routePointsType;
            const nextType = $("coordType").value;
            try {
                const currentPoints = parseCoordinates();
                routePoints = currentPoints.map(point =>
                    convertCoordinate(point, previousType, nextType)
                );
                routePointsType = nextType;
                syncCoordinateText();
                updateRoute();
                if (lastCameraResults.length && lastCameraResultsType) {
                    renderCameras(lastCameraResults, lastCameraResultsType);
                }
            } catch (error) {
                $("coordType").value = previousType;
                setStatus("切换坐标系失败：" + error.message, "error");
            }
        });
        $("coordinates").addEventListener("input", () => {
            try {
                routePoints = parseCoordinates();
                routePointsType = $("coordType").value;
                updateRoute();
            } catch (error) {
                // Keep the user's in-progress text; validation is performed before querying.
            }
        });
        syncCoordinateText();
        initializeAmap();
    })();
</script>
</body>
</html>
