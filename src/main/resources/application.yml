server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: camera-route-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/gis}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

# 摄像头业务表固定使用 public.ga_yjyd_camera，不在配置文件中配置表名。
camera:
  search:
    default-buffer-meters: 100
    max-buffer-meters: 10000
    # 路线按约 10 公里切段；超过 500 公里自动转为异步任务
    segment-length-meters: 10000
    async-threshold-meters: 500000
